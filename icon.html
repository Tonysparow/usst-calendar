<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #FBF1E0; }
    svg { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- 纸米底 -->
    <rect x="0" y="0" width="512" height="512" fill="#FBF1E0"/>
    <!-- 粗黑外框 -->
    <rect x="18" y="18" width="476" height="476" fill="none" stroke="#14100C" stroke-width="22"/>
    <!-- 印章硬投影 -->
    <rect x="112" y="112" width="304" height="304" fill="#14100C"/>
    <!-- 赭红印章 -->
    <rect x="88" y="88" width="304" height="304" fill="#D6402B" stroke="#14100C" stroke-width="18"/>
    <!-- “理”字 -->
    <text x="240" y="258" text-anchor="middle" dominant-baseline="central"
          font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif"
          font-size="216" font-weight="900" fill="#FFF9EE">理</text>
    <!-- 明黄横条 -->
    <rect x="184" y="430" width="112" height="26" fill="#FFD23F" stroke="#14100C" stroke-width="10"/>
  </svg>
</body>
</html>
