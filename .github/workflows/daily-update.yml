name: Daily Update

on:
  schedule:
    # 北京时间 08:30 = UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch latest campus events
        run: node tools/update-events.js
      - name: Commit and push if changed
        run: |
          git config user.name "usst-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/live-events.js js/live-events.json
          if git diff --cached --quiet; then
            echo "没有新事件，无需提交"
          else
            git commit -m "chore: daily event update $(date -u +%F)"
            git push
          fi
